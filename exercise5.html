<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>CSS Position Exercice</title>
    <style type="text/css">
    .contanier{
       border:orange solid;
       position:relative;
    }
    .box1 {
      width:100px;
      height:100px;
      background: blue;
    }
    .box2 {
      width: 100px;
      height:100px;
      background:green;
      border:yellow solid;
      position:absolute;
      top: 20px;
      left:20px;
    }
    .box3 {
      width:100px;
      height:100px;
      background: red;
    }
    .box4 {
      width: 100px;
      height:100px;
      background:pink;
    }
    </style>
  </head>
  <body>
    <div>
      <div class="contanier">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
    </div>
  </body>
</html>
